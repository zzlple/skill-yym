<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>油羊毛 · 加油优惠面板</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --line:#e6eaf2; --txt:#1f2733; --sub:#64748b;
    --sinopec:#e60012; --petrochina:#00a0e9; --both:#7c5cff; --channel:#0f9d76;
    --ok:#12a150; --warn:#e08c00; --long:#0f78d1; --end:#94a3b8;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.6 "Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;}
  .wrap{max-width:1360px;margin:0 auto;padding:20px 18px 56px}
  header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
  h1{margin:0;font-size:24px;letter-spacing:.5px}
  h1 span{font-size:13px;font-weight:400;color:var(--sub);margin-left:10px}
  .meta{font-size:13px;color:var(--sub);text-align:right}
  .meta b{color:var(--txt)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:14px}
  .filters{display:flex;flex-direction:column;gap:12px}
  .frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .flabel{width:56px;color:var(--sub);font-size:13px;flex:none}
  .chip{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:999px;
    padding:5px 14px;font-size:13px;cursor:pointer;transition:.15s;user-select:none}
  .chip:hover{border-color:#c3ccdd}
  .chip.on{background:#1f2733;color:#fff;border-color:#1f2733}
  .chip.on.petrochina{background:var(--petrochina);border-color:var(--petrochina)}
  .chip.on.sinopec{background:var(--sinopec);border-color:var(--sinopec)}
  .chip.on.both{background:var(--both);border-color:var(--both)}
  .chip.on.channel{background:var(--channel);border-color:var(--channel)}
  input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;
    padding:7px 12px;font-size:14px;outline:none;background:#fbfcfe}
  input[type=search]:focus{border-color:#9db4d6;background:#fff}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:#c3ccdd}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto}
  table{border-collapse:collapse;width:100%;min-width:1180px}
  thead th{position:sticky;top:0;background:#f8fafd;text-align:left;font-size:13px;color:var(--sub);
    font-weight:600;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
  tbody td{padding:12px;border-bottom:1px solid #eef1f7;vertical-align:top;font-size:13.5px}
  tbody tr:hover{background:#fbfcff}
  tbody tr.end{opacity:.62}
  .brand{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;color:#fff;white-space:nowrap}
  .brand.petrochina{background:var(--petrochina)}
  .brand.sinopec{background:var(--sinopec)}
  .brand.both{background:var(--both)}
  .brand.channel{background:var(--channel)}
  .title{font-weight:600;display:block;margin-top:6px;min-width:150px}
  .status{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;white-space:nowrap}
  .status.s-run{background:#e8f8ee;color:var(--ok)}
  .status.s-long{background:#e8f2fd;color:var(--long)}
  .status.s-todo{background:#fdf4e3;color:var(--warn)}
  .status.s-end{background:#eef1f6;color:var(--end)}
  .period{color:var(--sub);font-size:12.5px;margin-top:6px}
  .grades{display:flex;gap:4px;flex-wrap:wrap}
  .gg{background:#f1f5fb;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;white-space:nowrap}
  .scope{color:#475569;font-size:12.5px;max-width:330px}
  .benefit{max-width:320px}
  a.link{color:#0f78d1;text-decoration:none;word-break:break-all;font-size:12.5px}
  a.link:hover{text-decoration:underline}
  .qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;width:126px}
  .qrbox img{width:112px;height:112px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}
  .qrbox small{color:var(--sub);font-size:11px;line-height:1.35;text-align:center}
  .empty{padding:46px;text-align:center;color:var(--sub)}
  footer{margin-top:16px;color:var(--sub);font-size:12.5px;line-height:1.8}
  .notice{background:#fffaf0;border:1px solid #ffe6bd;border-radius:12px;padding:10px 14px;margin-bottom:14px;
    font-size:13px;color:#7a5200}
  @media(max-width:760px){
    .flabel{width:100%}
    h1{font-size:20px}
    .meta{text-align:left}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>油羊毛 <span>加油优惠面板 · 中国石油 / 中国石化 · 全国 / 湖北 / 陕西</span></h1>
    <div class="meta">
      数据更新：<b id="updated">—</b>　共 <b id="total">0</b> 条　筛选后 <b id="shown">0</b> 条<br />
      <span id="port"></span>　<span id="refresh"></span>
    </div>
  </header>

  <div class="notice" id="notice"></div>

  <div class="panel filters">
    <div class="frow" id="row-brand">
      <span class="flabel">品牌</span>
    </div>
    <div class="frow" id="row-grade">
      <span class="flabel">油号</span>
    </div>
    <div class="frow" id="row-region">
      <span class="flabel">地区</span>
    </div>
    <div class="frow" id="row-status">
      <span class="flabel">状态</span>
    </div>
    <div class="frow">
      <input type="search" id="kw" placeholder="搜索：活动名 / 优惠内容 / 适用站点（如 满220减10、易捷加油、荆门）" />
      <button class="btn" id="reload">重新读取数据文件</button>
      <button class="btn" id="reset">重置筛选</button>
    </div>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>品牌 / 活动</th>
          <th>时间</th>
          <th>地区</th>
          <th>优惠内容</th>
          <th>适用油号</th>
          <th>活动链接</th>
          <th>活动入口二维码</th>
          <th>优惠券支持使用的范围</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">没有符合筛选条件的优惠，试试放宽条件。</div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
const STATUS_CLASS = {"进行中":"s-run","长期有效":"s-long","待确认":"s-todo","部分有效":"s-todo","已结束":"s-end"};
const BRAND_ORDER = ["petrochina","sinopec","both","channel"];
let DATA = {items:[], brands:[], regions:[], grades:[]};
let F = {brand:"all", grade:"all", region:"all", status:"all", kw:""};

function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

function chipRow(rowId, items, key, cls){
  const row = el(rowId);
  items.forEach(it=>{
    const b = document.createElement("div");
    b.className = "chip" + (cls&&it.value!=="all" ? " "+cls : "");
    b.dataset.value = it.value;
    b.textContent = it.label;
    b.onclick = ()=>{ F[key]=it.value; render(); };
    row.appendChild(b);
  });
}

function buildFilters(){
  const brandRow = el("row-brand");
  brandRow.innerHTML = '<span class="flabel">品牌</span>';
  const brandItems = [{value:"all",label:"全部"}].concat(
    BRAND_ORDER.filter(k=>(DATA.brands||[]).some(b=>b.key===k))
      .map(k=>({value:k,label:(DATA.brands.find(b=>b.key===k)||{}).name})));
  chipRow("row-brand", brandItems, "brand");
  // 品牌按钮上色
  [...brandRow.querySelectorAll(".chip")].forEach(c=>{ if(c.dataset.value!=="all") c.classList.add(c.dataset.value); });

  const gradeItems = [{value:"all",label:"全部"}].concat(
    (DATA.grades||["92","95","98"]).map(g=>({value:g,label:g+"#"})));
  chipRow("row-grade", gradeItems, "grade");
  const regionItems = [{value:"all",label:"全部"}].concat(
    (DATA.regions||["全国","湖北","陕西"]).map(r=>({value:r, label:(r==="全国" ? "全国通用" : r)})));
  chipRow("row-region", regionItems, "region");
  chipRow("row-status", [{value:"all",label:"全部"},{value:"进行中",label:"进行中"},{value:"长期有效",label:"长期有效"},{value:"待确认",label:"待确认"},{value:"已结束",label:"已结束"}],"status");
  // 修正油号 chip 文本
  [...el("row-grade").querySelectorAll(".chip")].forEach(c=>{
    if(c.dataset.value!=="all") c.textContent = c.dataset.value + "#";
  });
}

function match(it){
  if(F.brand!=="all"){
    if(F.brand==="petrochina" && it.brand!=="petrochina" && it.brand!=="both") return false;
    if(F.brand==="sinopec" && it.brand!=="sinopec" && it.brand!=="both") return false;
    if(F.brand==="both" && it.brand!=="both") return false;
    if(F.brand==="channel" && it.brand!=="channel") return false;
  }
  if(F.grade!=="all" && !((it.grades||[]).includes(F.grade))) return false;
  if(F.region!=="all" && it.region!==F.region) return false;
  if(F.status!=="all" && it.status!==F.status) return false;
  if(F.kw){
    // 关键词忽略空格，便于「满220减10」这类输入命中「满 220 减 10」
    const norm = s => String(s||"").replace(/\s+/g,"").toLowerCase();
    const t = norm(it.title+it.benefit+it.scope+it.entry+it.brand_name+it.region+it.period);
    if(!t.includes(norm(F.kw))) return false;
  }
  return true;
}

function render(){
  // 筛选态
  ['row-brand','row-grade','row-region','row-status'].forEach(id=>{
    const key = {"row-brand":"brand","row-grade":"grade","row-region":"region","row-status":"status"}[id];
    [...el(id).querySelectorAll(".chip")].forEach(c=>c.classList.toggle("on", c.dataset.value===F[key]));
  });

  const items = (DATA.items||[]).filter(match);
  el("shown").textContent = items.length;
  const tb = el("tbody"); tb.innerHTML = "";
  el("empty").style.display = items.length ? "none" : "block";

  items.forEach(it=>{
    const tr = document.createElement("tr");
    if(it.status==="已结束") tr.className = "end";
    const st = STATUS_CLASS[it.status] || "s-todo";
    tr.innerHTML = `
      <td>
        <span class="brand ${esc(it.brand)}">${esc(it.brand_name)}</span>
        <span class="title">${esc(it.title)}</span>
      </td>
      <td>
        <span class="status ${st}">${esc(it.status)}</span>
        <div class="period">${esc(it.period)}</div>
      </td>
      <td>${esc(it.region)}</td>
      <td class="benefit">${esc(it.benefit)}</td>
      <td><div class="grades">${(it.grades||[]).map(g=>`<span class="gg">${esc(g)}#</span>`).join("")}</div></td>
      <td>
        <a class="link" href="${esc(it.entry_url)}" target="_blank" rel="noreferrer">${esc(it.entry)}</a>
        <div class="period">来源：${esc(it.source)}</div>
      </td>
      <td>
        <div class="qrbox">
          <img loading="lazy" src="/api/qr?text=${encodeURIComponent(it.entry_url)}" alt="活动入口二维码"
               onclick="window.open('${esc(it.entry_url)}','_blank')" />
          <small>${esc(it.qr_label||"")}</small>
        </div>
      </td>
      <td><div class="scope">${esc(it.scope)}</div></td>`;
    tb.appendChild(tr);
  });
}

/* ---------- 定时采集 / 自动刷新 ---------- */
const DEFAULT_SEC = 900;            // 兜底：15 分钟
let SIG = "";                       // 数据文件签名（mtime|条数|更新时间）
let TIMER = null, CUR_SEC = 0, LAST = 0, FAILED = 0;

function periodSec(){ return Math.max(30, parseInt(DATA.auto_refresh_sec,10) || DEFAULT_SEC); }
function sigOf(d){ return [d.data_mtime||0, d.total||0, d.updated_at||""].join("|"); }

function tipRefresh(extra){
  const t = LAST ? new Date(LAST).toLocaleTimeString("zh-CN", {hour12:false}) : "—";
  el("refresh").innerHTML = "每 " + Math.round(periodSec()/60) + " 分钟自动采集　·　上次刷新 <b>" + t + "</b>"
    + (extra ? '　<span style="color:#12a150">' + esc(extra) + "</span>" : "")
    + (FAILED ? '　<span style="color:#c0392b">服务未响应，下个周期重试</span>' : "");
}

function scheduleRefresh(){
  const sec = periodSec();
  if(TIMER && CUR_SEC === sec) return;
  if(TIMER) clearInterval(TIMER);
  CUR_SEC = sec;
  TIMER = setInterval(()=>load({silent:true}), sec*1000);
}

async function load(opts){
  const silent = !!(opts && opts.silent);
  let d;
  try{
    const r = await fetch("/api/coupons", {cache:"no-store"});
    d = await r.json();
    FAILED = 0;
  }catch(e){
    FAILED++;
    tipRefresh();
    return;
  }
  const changed = SIG && sigOf(d) !== SIG;
  DATA = d;
  if(d.ok === false){ el("notice").textContent = "数据读取异常：" + (d.error||""); }
  el("updated").textContent = d.updated_at || "—";
  el("total").textContent = d.total || (d.items||[]).length;
  el("notice").innerHTML = "<b>提示：</b>" + esc(d.disclaimer || "");
  el("footer").innerHTML = "面板由本地 skill「油羊毛」提供（端口 " + location.port + "）　|　"
    + "数据文件：<code>" + esc(d.data_file || "data/coupons.json") + "</code>"
    + (d.data_mtime_iso ? "（最后修改 " + esc(d.data_mtime_iso) + "）" : "") + "　|　"
    + "页面每 " + Math.round(periodSec()/60) + " 分钟自动重读一次数据文件，改动保存后也可点「重新读取数据文件」立即生效　|　"
    + "二维码为活动入口链接的实时生成图，朝向/清晰度不足时可点击放大或直接在浏览器打开链接。";
  if(!SIG || changed) buildFilters();
  render();
  SIG = sigOf(d);
  LAST = Date.now();
  tipRefresh(changed ? "检测到数据文件更新，已自动刷新" : "");
  scheduleRefresh();
}

el("kw").addEventListener("input", e=>{ F.kw = e.target.value.trim(); render(); });
el("reset").onclick = ()=>{ F={brand:"all",grade:"all",region:"all",status:"all",kw:""}; el("kw").value=""; render(); };
el("reload").onclick = async ()=>{ await fetch("/api/reload",{cache:"no-store"}); await load({silent:true}); };
// 标签页切回前台时，若已超过一个刷新周期则立刻补一次
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && LAST && Date.now() - LAST > periodSec()*1000) load({silent:true});
});
load();
</script>
</body>
</html>
